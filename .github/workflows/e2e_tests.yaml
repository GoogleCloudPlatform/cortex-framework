name: E2E Test Demo Run

on:
  pull_request:
  merge_group:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-demo-test:
    if: github.repository_owner == 'GoogleCloudPlatform'
    runs-on: self-hosted
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "latest"

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: 'projects/298863010186/locations/global/workloadIdentityPools/cortex-e2e-tests-pool/providers/github-provider'
          service_account: 'github-e2e-tests@cortex-framework-argolis.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Generate Execution ID and Names
        run: |
          # Generate a unique ID
          EXEC_ID="e2e_$(date +'%Y%m%d_%H%M%S')_${{ github.run_id }}"
          echo "EXECUTION_ID=$EXEC_ID" >> $GITHUB_ENV
          
          # Derive names
          echo "TARGET_SAP_FOUNDATION_DATASET_ID=${EXEC_ID}_sap_foundation" >> $GITHUB_ENV
          echo "TARGET_DP_DATASET_ID=${EXEC_ID}_dp" >> $GITHUB_ENV
          echo "SOURCE_SAP_RAW_DATASET_ID=${EXEC_ID}_sap_raw" >> $GITHUB_ENV
          echo "TARGET_SAMPLES_DATASET_ID=${EXEC_ID}_samples" >> $GITHUB_ENV
          echo "REPOSITORY_NAME=${EXEC_ID}_repo" >> $GITHUB_ENV

      - name: Create BigQuery Datasets
        run: |
          echo "Creating dataset $SOURCE_SAP_RAW_DATASET_ID..."
          bq mk --project_id cortex-framework-argolis --location US $SOURCE_SAP_RAW_DATASET_ID
          echo "Creating dataset $TARGET_SAP_FOUNDATION_DATASET_ID..."
          bq mk --project_id cortex-framework-argolis --location US $TARGET_SAP_FOUNDATION_DATASET_ID
          echo "Creating dataset $TARGET_DP_DATASET_ID..."
          bq mk --project_id cortex-framework-argolis --location US $TARGET_DP_DATASET_ID
          echo "Creating dataset $TARGET_SAMPLES_DATASET_ID..."
          bq mk --project_id cortex-framework-argolis --location US $TARGET_SAMPLES_DATASET_ID

      - name: Run cortex-demo
        run: |
          uv run cortex-demo \
            --project_id cortex-framework-argolis \
            --service_account github-e2e-tests@cortex-framework-argolis.iam.gserviceaccount.com \
            --source_sap_raw_dataset_id $SOURCE_SAP_RAW_DATASET_ID \
            --target_sap_foundation_dataset_id $TARGET_SAP_FOUNDATION_DATASET_ID \
            --target_dp_dataset_id $TARGET_DP_DATASET_ID \
            --target_samples_dataset_id $TARGET_SAMPLES_DATASET_ID \
            --repository_name $REPOSITORY_NAME

      - name: Cleanup
        if: always()
        run: |
          # Delete BigQuery datasets
          echo "Deleting dataset $SOURCE_SAP_RAW_DATASET_ID..."
          bq rm -r -f cortex-framework-argolis:$SOURCE_SAP_RAW_DATASET_ID || true
          echo "Deleting dataset $TARGET_SAP_FOUNDATION_DATASET_ID..."
          bq rm -r -f cortex-framework-argolis:$TARGET_SAP_FOUNDATION_DATASET_ID || true
          echo "Deleting dataset $TARGET_DP_DATASET_ID..."
          bq rm -r -f cortex-framework-argolis:$TARGET_DP_DATASET_ID || true
          echo "Deleting dataset $TARGET_SAMPLES_DATASET_ID..."
          bq rm -r -f cortex-framework-argolis:$TARGET_SAMPLES_DATASET_ID || true
          
          # Delete Dataform resources using Python
          uv run python -c "
          import time
          from google.cloud import dataform_v1beta1
          from google.api_core import exceptions
          client = dataform_v1beta1.DataformClient()
          project = 'cortex-framework-argolis'
          region = 'us-central1'
          repo = '$REPOSITORY_NAME'
          
          # 1. Delete Workflow Configurations
          schedules = ['hourly', 'daily', 'weekly', 'monthly', 'yearly']
          for schedule in schedules:
              wf_config_id = f'{repo}-{schedule}'
              wf_config_name = client.workflow_config_path(project, region, repo, wf_config_id)
              try:
                  client.delete_workflow_config(name=wf_config_name)
                  print(f'Deleted workflow config {wf_config_id}.')
              except exceptions.NotFound:
                  pass  # Suppress warnings for non-existent schedules
              except Exception as e:
                  print(f'Error deleting workflow config {wf_config_id}: {e}')
          
          # 2. Delete Release Configuration
          release_config_id = f'{repo}-release'
          release_config_name = client.release_config_path(project, region, repo, release_config_id)
          try:
              client.delete_release_config(name=release_config_name)
              print(f'Deleted release config {release_config_id}.')
          except exceptions.NotFound:
              pass
          except Exception as e:
              print(f'Error deleting release config: {e}')
          
          # 3. Delete Workspaces
          repo_name = client.repository_path(project, region, repo)
          try:
              request = dataform_v1beta1.ListWorkspacesRequest(parent=repo_name)
              workspaces = client.list_workspaces(request=request)
              for ws in workspaces:
                  try:
                      ws_request = dataform_v1beta1.DeleteWorkspaceRequest(name=ws.name)
                      client.delete_workspace(request=ws_request)
                      print(f'Deleted workspace {ws.name}.')
                  except exceptions.NotFound:
                      pass
                  except Exception as e:
                      print(f'Error deleting workspace {ws.name}: {e}')
          except exceptions.NotFound:
              pass
          except Exception as e:
              print(f'Error listing workspaces: {e}')
          
          # Wait for resource deletion to propagate
          time.sleep(5)
          
          # 4. Delete Repository (force=True to delete workspaces)
          try:
              request = dataform_v1beta1.DeleteRepositoryRequest(name=repo_name, force=True)
              client.delete_repository(request=request)
              print(f'Deleted repository {repo}.')
          except exceptions.NotFound:
              pass
          except Exception as e:
              print(f'Error deleting repository {repo}: {e}')
          "
