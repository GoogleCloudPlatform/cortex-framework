displayName: SAP Sustainability & Carbon Emissions
description: This data product enables enterprise ESG and carbon accounting by calculating
  Scope 1, Scope 2, and Scope 3 greenhouse gas (GHG) emissions from SAP S/4HANA procurement,
  material master, and plant logistics. It delivers spend-based and mass-based CO2 equivalent
  (CO2e) metrics to support compliance with EU CSRD, SEC climate rules, and the GHG Protocol.
category: source_aligned_product
type: sustainability_and_emissions
dependencies:
  sapModule:
    supportedVersions:
    - s4
    tables:
      s4:
      - ekko
      - ekpo
      - lfa1
      - mara
      - matdoc
      - t001w
      common:
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
